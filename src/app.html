<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			} catch (_) {}
		</script>
		<title>Mysten PQ Signatures Zoo</title>
		<meta name="description" content="Post-quantum signature comparison curated for Sui's PQ-authenticator decision, with Mysten-measured benchmarks." />
		<meta property="og:title" content="Mysten PQ Signatures Zoo" />
		<meta property="og:description" content="Post-quantum signature comparison curated for Sui's PQ-authenticator decision, with Mysten-measured benchmarks." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Mysten PQ Signatures Zoo" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Mysten PQ Signatures Zoo" />
		<meta name="twitter:description" content="Post-quantum signature comparison curated for Sui's PQ-authenticator decision, with Mysten-measured benchmarks." />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
